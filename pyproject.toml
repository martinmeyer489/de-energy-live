[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "de-energy-live"
version = "0.1.0"
description = "Real-time electricity supply and demand data for Germany"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
de-energy = "de_energy_live.cli:main"

[tool.setuptools.packages.find]
include = ["de_energy_live*"]

[tool.setuptools.package-data]
de_energy_live = ["*.geo.json"]
